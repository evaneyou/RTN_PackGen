[package]
name = "rtnp-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rtnp-send, rtnp-recv, rtnp-logd and rtnp-decode command line tools"

[[bin]]
name = "rtnp-send"
path = "src/bin/rtnp-send.rs"

[[bin]]
name = "rtnp-recv"
path = "src/bin/rtnp-recv.rs"

[[bin]]
name = "rtnp-logd"
path = "src/bin/rtnp-logd.rs"

[[bin]]
name = "rtnp-decode"
path = "src/bin/rtnp-decode.rs"

[dependencies]
rtnp-core = { path = "../rtnp-core" }
anyhow.workspace = true
clap.workspace = true
humantime.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio.workspace = true
