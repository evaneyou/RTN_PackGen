[workspace]
resolver = "2"
members = ["crates/rtnp-core", "crates/rtnp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/evaneyou/RTN_PackGen"
authors = ["Evan You"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
